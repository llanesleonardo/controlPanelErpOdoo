openapi: 3.1.0
info:
  title: Sales domain sample contracts
  version: 0.0.1
paths: {}
components:
  schemas:
    SalesOrderCreateIntent:
      type: object
      required: [intent_code, partner_id, order_lines, execution_mode]
      properties:
        intent_code:
          const: sales.order.create
        partner_id:
          type: integer
        order_lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: integer }
              quantity: { type: number }
              price_unit: { type: number }
        execution_mode:
          $ref: './schemas/common.yaml#/components/schemas/ExecutionMode'
        observability:
          $ref: './schemas/common.yaml#/components/schemas/Observability'
      x-validation-rules:
        - partner exists and is customer
        - products exist and are sellable
      x-approval-policy: manager if order total exceeds threshold
      x-idempotency: client-supplied Idempotency-Key header
      x-timeout-seconds: 60
      x-retry: none on commit; safe retry on dry_run
      x-expected-output:
        - odoo_order_id
        - status
        - warnings
      x-verification: read back sales.order state in Odoo
      x-rollback: cancel draft order if still draft; else compensating note

    SalesOrderCreateResult:
      type: object
      required: [state, odoo_order_id]
      properties:
        state:
          $ref: './schemas/common.yaml#/components/schemas/ResultState'
        odoo_order_id:
          type: integer
        warnings:
          type: array
          items: { type: string }
