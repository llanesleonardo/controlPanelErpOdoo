# Scaffold stub — services listed for later implementation.
# Apps are placeholders; do not expect a full running stack yet.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CONTROLPLANE_DB_NAME:-controlpanel}
      POSTGRES_USER: ${CONTROLPLANE_DB_USER:-controlpanel}
      POSTGRES_PASSWORD: ${CONTROLPLANE_DB_PASSWORD:-change-me}
    ports:
      - "${CONTROLPLANE_DB_PORT:-5432}:5432"
    volumes:
      - controlplane_pg:/var/lib/postgresql/data

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    env_file:
      - ../.env
    ports:
      - "${GATEWAY_PORT:-3001}:3001"
    depends_on:
      - postgres

  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.orchestrator
    env_file:
      - ../.env
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    depends_on:
      - postgres
      - gateway

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    env_file:
      - ../.env
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - gateway

  # Odoo is external — not started by this Compose file.

volumes:
  controlplane_pg:
